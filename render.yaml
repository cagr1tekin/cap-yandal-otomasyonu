# Render Blueprint: API (NestJS) ve e-posta kuyruğu için Redis, ikisi de ücretsiz plan.
# Veritabanı Neon'da (DATABASE_URL), web arayüzü Vercel'de (WEB_ORIGIN). Ayrıntı: docs/YAYINLAMA.md
services:
  - type: web
    name: cap-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @cap/api exec prisma generate &&
      pnpm turbo run build --filter=@cap/api
    # Ücretsiz planda pre-deploy komutu yok: göçler açılışta uygulanır (uygulanmış göç atlanır).
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cap-redis
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: db
      # E-posta kapalı: şifre belirleme bağlantısını koordinatör ekrandan alıp kişiye iletir.
      # Açmak için MAIL_ENABLED=true ve SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASS/MAIL_FROM girin.
      - key: MAIL_ENABLED
        value: "false"
      - key: WORKER_ENABLED
        value: "true"
      - key: LOG_PRETTY
        value: "false"

  - type: keyvalue
    name: cap-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
