name: cap-yandal

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cap
      POSTGRES_PASSWORD: cap_dev
      POSTGRES_DB: cap
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cap"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6389:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8035:8025"
      - "127.0.0.1:1035:1025"

volumes:
  pgdata:
